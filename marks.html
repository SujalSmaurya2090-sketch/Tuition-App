<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#4f46e5">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
  }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Marks & Assessment Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="text-2xl font-bold text-gray-800">📝 Rapid Marks Entry</h2>
            <a href="/" class="text-indigo-600 hover:underline font-semibold">← Back to Dashboard</a>
        </div>
        
        <!-- Test Meta Info Form -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-indigo-50 p-4 rounded-lg">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Select Class/Batch:</label>
                <select id="classSelect" onchange="loadStudents()" class="w-full border-2 border-indigo-500 rounded-lg p-2 font-bold text-indigo-700">
                    <option value="">-- Loading Classes... --</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Subject Name:</label>
                <input type="text" id="subjectInput" placeholder="e.g. Physics / Maths" class="w-full border-2 border-gray-300 rounded-lg p-2 font-semibold">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Test Title:</label>
                <input type="text" id="testTitleInput" placeholder="e.g. Unit Test 1" class="w-full border-2 border-gray-300 rounded-lg p-2 font-semibold">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Test Date:</label>
                <input type="date" id="testDateInput" class="w-full border-2 border-gray-300 rounded-lg p-2 font-semibold">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Total Max Marks:</label>
                <input type="number" id="totalMarksInput" placeholder="e.g. 50 or 100" class="w-full border-2 border-gray-300 rounded-lg p-2 font-semibold" value="50">
            </div>
        </div>

        <span id="loader" class="hidden text-indigo-600 font-semibold mb-4 block">Loading Students...</span>

        <!-- Marks Entry Table -->
        <div id="registerContainer" class="hidden">
            <table class="w-full border-collapse border border-gray-200 mb-6">
                <thead>
                    <tr class="bg-indigo-600 text-white">
                        <th class="p-3 text-left w-16">ID</th>
                        <th class="p-3 text-left">Student Name</th>
                        <th class="p-3 text-left w-36">Marks Obtained</th>
                        <th class="p-3 text-left">Teacher Remarks (Optional)</th>
                    </tr>
                </thead>
                <tbody id="studentListTable"></tbody>
            </table>

            <button onclick="submitMarks()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg text-lg">
                💾 Submit Test Marks
            </button>
        </div>
    </div>

    <script>
        let studentData = [];

        // Set default today date
        document.getElementById('testDateInput').valueAsDate = new Date();

        // Load Classes on Startup
        window.onload = async function() {
            const classSelect = document.getElementById('classSelect');
            try {
                const res = await fetch('/get_classes');
                const data = await res.json();
                
                classSelect.innerHTML = '<option value="">-- Choose Class --</option>';
                if(data.classes && data.classes.length > 0) {
                    data.classes.forEach(c => {
                        classSelect.innerHTML += `<option value="${c}">${c}</option>`;
                    });
                } else {
                    classSelect.innerHTML = '<option value="">No Classes Found</option>';
                }
            } catch(e) {
                classSelect.innerHTML = '<option value="">Error Loading Classes</option>';
            }
        };

        // Load Active Students for selected class
        async function loadStudents() {
            const className = document.getElementById('classSelect').value;
            const container = document.getElementById('registerContainer');
            if(!className) {
                container.classList.add('hidden');
                return;
            }

            document.getElementById('loader').classList.remove('hidden');
            const res = await fetch(`/get_students/${className}`);
            const data = await res.json();
            document.getElementById('loader').classList.add('hidden');

            studentData = data.students || [];
            const tableBody = document.getElementById('studentListTable');
            tableBody.innerHTML = '';

            if(studentData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500 font-bold">Is class mein koi Active student nahi hai.</td></tr>`;
            } else {
                studentData.forEach(student => {
                    tableBody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3 font-bold">${student.Student_ID}</td>
                            <td class="p-3 font-medium">${student.Full_Name}</td>
                            <td class="p-3">
                                <input type="number" id="marks-${student.Student_ID}" min="0" placeholder="0" 
                                    class="w-full border-2 border-gray-300 rounded p-2 text-center font-bold text-indigo-700 focus:border-indigo-600 outline-none">
                            </td>
                            <td class="p-3">
                                <input type="text" id="remarks-${student.Student_ID}" placeholder="e.g. Good performance / Needs practice" 
                                    class="w-full border border-gray-300 rounded p-2 text-sm text-gray-700">
                            </td>
                        </tr>
                    `;
                });
            }
            container.classList.remove('hidden');
        }

        // Submit Marks Data to Backend
        async function submitMarks() {
            const className = document.getElementById('classSelect').value;
            const subject = document.getElementById('subjectInput').value.trim();
            const testTitle = document.getElementById('testTitleInput').value.trim();
            const testDate = document.getElementById('testDateInput').value;
            const totalMarks = parseFloat(document.getElementById('totalMarksInput').value);

            // Inputs Validation Checks
            if(!className || !subject || !testTitle || !testDate || isNaN(totalMarks) || totalMarks <= 0) {
                alert(' Please fill Class, Subject, Test Title, Date, and Total Max Marks correctly.');
                return;
            }

            // Prepare Marks Payload & Check Obtained > Max Marks validation
            let marksPayload = [];
            let validationError = false;

            studentData.forEach(s => {
                const marksVal = document.getElementById(`marks-${s.Student_ID}`).value;
                const remarksVal = document.getElementById(`remarks-${s.Student_ID}`).value.trim();
                const obtainedNum = parseFloat(marksVal) || 0;

                if(obtainedNum > totalMarks) {
                    alert(` Error: Student ${s.Full_Name} ke Obtained Marks (${obtainedNum}) Total Marks (${totalMarks}) se bade nahi ho sakte!`);
                    validationError = true;
                    return;
                }

                marksPayload.push({
                    student_id: s.Student_ID,
                    student_name: s.Full_Name,
                    obtained_marks: obtainedNum,
                    remarks: remarksVal
                });
            });

            if(validationError) return;

            const payload = {
                class_name: className,
                subject: subject,
                test_title: testTitle,
                test_date: testDate,
                total_marks: totalMarks,
                marks_data: marksPayload,
                teacher_email: 'teacher@tuition.com'
            };

            const response = await fetch('/save_marks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if(result.status === 'success') {
                alert(result.message);
                location.reload();
            } else {
                alert(' Error: ' + result.message);
            }
        }
    </script>
</body>
</html>
