<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Scan Attendance • Ample Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4">

  <!-- Reusable Popup Modal -->
  <div id="appPopupBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div id="appPopupCard" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0 duration-200">
      <div class="p-5">
        <div class="flex items-start gap-3.5">
          <div id="appPopupIcon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold"></div>
          <div class="min-w-0 flex-1">
            <h3 id="appPopupTitle" class="text-base font-semibold text-white"></h3>
            <p id="appPopupMessage" class="mt-1 text-sm text-slate-300 leading-relaxed"></p>
          </div>
        </div>
        <div class="mt-5 flex justify-end">
          <button id="appPopupCloseBtn" type="button" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white transition">
            Theek Hai
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="w-full max-w-md rounded-3xl bg-slate-900 border border-slate-800 p-5 sm:p-6 shadow-2xl text-center">
    <div class="flex items-center justify-between mb-4">
      <div class="text-left">
        <p class="text-[11px] uppercase tracking-wider text-indigo-400 font-semibold">Branch Verification</p>
        <h1 class="text-lg sm:text-xl font-bold text-white">Attendance Scanner</h1>
      </div>
      <a href="/" class="px-3 py-2 rounded-xl text-xs font-medium bg-slate-950 hover:bg-slate-800 border border-slate-800 text-indigo-300 transition">
        ← Home
      </a>
    </div>

    <p class="text-xs text-slate-400 mb-4">
      Classroom QR code ko camera ke saamne rakhein aur location allow karein.
    </p>

    <div id="status-box" class="hidden mb-4 p-3 rounded-xl text-xs sm:text-sm font-medium border"></div>

    <div id="login-btn-container" class="hidden mb-4">
      <a href="/login" class="inline-flex items-center justify-center w-full h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition">
        Login Karein
      </a>
    </div>

    <div id="reader" class="overflow-hidden rounded-2xl border border-dashed border-slate-700 bg-slate-950 min-h-[250px]"></div>
  </div>

  <script>
    window.showAppPopup = function (message, type = 'info', title = '') {
      const backdrop = document.getElementById('appPopupBackdrop');
      const card = document.getElementById('appPopupCard');
      const iconEl = document.getElementById('appPopupIcon');
      const titleEl = document.getElementById('appPopupTitle');
      const msgEl = document.getElementById('appPopupMessage');
      const closeBtn = document.getElementById('appPopupCloseBtn');
      if (!backdrop || !card) return;

      const styles = {
        success: { defaultTitle: 'Safalta', iconBg: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30', btnBg: 'bg-emerald-600 hover:bg-emerald-500', symbol: '✓' },
        error: { defaultTitle: 'Dhyan Dein', iconBg: 'bg-rose-500/15 text-rose-400 border border-rose-500/30', btnBg: 'bg-rose-600 hover:bg-rose-500', symbol: '!' },
        info: { defaultTitle: 'Soochna', iconBg: 'bg-indigo-500/15 text-indigo-400 border border-indigo-500/30', btnBg: 'bg-indigo-600 hover:bg-indigo-500', symbol: 'i' }
      };
      const cfg = styles[type] || styles.info;
      iconEl.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold ${cfg.iconBg}`;
      iconEl.textContent = cfg.symbol;
      titleEl.textContent = title || cfg.defaultTitle;
      msgEl.textContent = String(message || 'Kripya dubara koshish karein.');
      closeBtn.className = `px-5 py-2.5 rounded-xl text-sm font-medium text-white transition ${cfg.btnBg}`;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      requestAnimationFrame(() => { card.classList.remove('scale-95', 'opacity-0'); card.classList.add('scale-100', 'opacity-100'); });

      const hidePopup = () => {
        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { backdrop.classList.add('hidden'); backdrop.classList.remove('flex'); }, 160);
      };
      closeBtn.onclick = hidePopup;
      backdrop.onclick = (e) => { if (e.target === backdrop) hidePopup(); };
    };

    const loggedInUserEmail = "{{ session.get('email', '') }}";
    let html5QrcodeScanner = null;
    let locationWatchId = null;
    let bestPosition = null;
    let locationTimer = null;
    let scanInProgress = false;

    function showStatus(msg, isError = false) {
      const box = document.getElementById('status-box');
      box.classList.remove(
        'hidden',
        'bg-emerald-500/15', 'text-emerald-300', 'border-emerald-500/30',
        'bg-rose-500/15', 'text-rose-300', 'border-rose-500/30'
      );
      if (isError) {
        box.classList.add('bg-rose-500/15', 'text-rose-300', 'border-rose-500/30');
      } else {
        box.classList.add('bg-emerald-500/15', 'text-emerald-300', 'border-emerald-500/30');
      }
      box.textContent = msg;
    }

    function finishLocation(callback) {
      if (locationWatchId !== null) {
        navigator.geolocation.clearWatch(locationWatchId);
        locationWatchId = null;
      }
      if (locationTimer) {
        clearTimeout(locationTimer);
        locationTimer = null;
      }
      callback(bestPosition);
    }

    function getBestLocation(callback) {
      bestPosition = null;
      showStatus("Accurate GPS location li ja rahi hai... thoda wait karein.", false);

      if (!navigator.geolocation) {
        callback(null);
        return;
      }

      locationWatchId = navigator.geolocation.watchPosition(
        function (position) {
          const accuracy = Number(position.coords.accuracy);
          if (!bestPosition || accuracy < Number(bestPosition.coords.accuracy)) {
            bestPosition = position;
          }
          showStatus("GPS accuracy check ho rahi hai...", false);
          if (accuracy <= 15) {
            finishLocation(callback);
          }
        },
        function () {
          finishLocation(callback);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );

      locationTimer = setTimeout(function () {
        finishLocation(callback);
      }, 10000);
    }

    function restartScanner() {
      scanInProgress = false;
      setTimeout(function () {
        if (html5QrcodeScanner) {
          try { html5QrcodeScanner.resume(); } catch (_) {}
        }
      }, 2500);
    }

    async function onScanSuccess(decodedText) {
      if (scanInProgress) return;
      scanInProgress = true;

      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.pause(true); } catch (_) {}
      }

      getBestLocation(async function (position) {
        if (!position) {
          const msg = "Location nahi mil paayi. Kripya phone ki location ON aur allow karke dubara try karein.";
          showStatus(msg, true);
          window.showAppPopup(msg, 'error', 'Location Zaroori');
          restartScanner();
          return;
        }

        showStatus("Attendance verify aur save ki ja rahi hai...", false);

        try {
          const res = await fetch('/api/scan_qr_attendance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              qr_code: decodedText,
              lat: position.coords.latitude,
              lon: position.coords.longitude,
              accuracy: position.coords.accuracy,
              email: loggedInUserEmail
            })
          });

          let data = {};
          try { data = await res.json(); } catch (_) { data = { status: 'error' }; }

          if (res.ok && data.status === 'success') {
            const msg = data.message || 'Attendance safaltapurvak mark ho gayi!';
            showStatus(msg, false);
            window.showAppPopup(msg, 'success');
            scanInProgress = false;
          } else {
            const p = data.popup || {};
            const msg = p.message || data.message || 'Attendance mark nahi ho paayi.';
            showStatus(msg, true);
            window.showAppPopup(msg, 'error', p.title || 'Dhyan Dein');
            restartScanner();
          }
        } catch (_) {
          const msg = "Internet ya server connection mein dikkat hai. Kripya dubara try karein.";
          showStatus(msg, true);
          window.showAppPopup(msg, 'error', 'Connection Samasya');
          restartScanner();
        }
      });
    }

    function startScanner() {
      if (typeof Html5QrcodeScanner === "undefined") {
        const msg = "Scanner load nahi ho paaya. Kripya internet check karein.";
        showStatus(msg, true);
        window.showAppPopup(msg, 'error');
        return;
      }

      try {
        html5QrcodeScanner = new Html5QrcodeScanner(
          "reader",
          {
            fps: 10,
            qrbox: { width: 240, height: 240 },
            rememberLastUsedCamera: true,
            showTorchButtonIfSupported: true
          }
        );
        html5QrcodeScanner.render(onScanSuccess);
      } catch (_) {
        const msg = "Camera scanner start nahi ho paaya. Page refresh karke try karein.";
        showStatus(msg, true);
        window.showAppPopup(msg, 'error');
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (!loggedInUserEmail) {
        const msg = "Aap abhi logged in nahi hain. Kripya pehle login karein.";
        showStatus(msg, true);
        document.getElementById('login-btn-container').classList.remove('hidden');
        return;
      }
      startScanner();
    });
  </script>
</body>
</html>
