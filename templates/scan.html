<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scan Attendance - AMPLE VISION</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center">

        <h2 class="text-2xl font-bold mb-1 text-slate-100">
            Teacher Attendance Scanner
        </h2>

        <p class="text-xs text-slate-400 mb-4">
            Classroom QR code ko camera ke saamne laayein
        </p>


        <!-- STATUS -->
        <div
            id="status-box"
            class="hidden mb-4 p-3 rounded-lg text-sm font-semibold transition-all">
        </div>


        <!-- LOGIN BUTTON -->
        <div id="login-btn-container" class="hidden mb-4">

            <a
                href="/login"
                class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg shadow-lg transition">

                Click Here to Login First

            </a>

        </div>


        <!-- HOME LINK -->
        <a
            href="/"
            class="inline-block mb-4 text-indigo-300 hover:text-indigo-200 underline">

            Click to go to AMPLE VISION

        </a>


        <!-- QR SCANNER -->
        <div
            id="reader"
            class="overflow-hidden rounded-xl border-2 border-dashed border-slate-600 bg-slate-950 min-h-[250px]">
        </div>

    </div>

   <script>

    // ==================================================
    // LOGIN
    // ==================================================

    const urlParams = new URLSearchParams(window.location.search);

    const loggedInUserEmail =
        urlParams.get('email') ||
        "{{ session.get('email', '') }}";


    let html5QrcodeScanner = null;

    let locationWatchId = null;

    let bestPosition = null;

    let locationStartTime = null;

    let locationTimer = null;

    let scanInProgress = false;


    // ==================================================
    // STATUS MESSAGE
    // ==================================================

    function showStatus(msg, isError = false) {

        const box = document.getElementById('status-box');

        box.classList.remove(
            'hidden',
            'bg-emerald-500/20',
            'text-emerald-400',
            'bg-rose-500/20',
            'text-rose-400'
        );

        if (isError) {

            box.classList.add(
                'bg-rose-500/20',
                'text-rose-400'
            );

        } else {

            box.classList.add(
                'bg-emerald-500/20',
                'text-emerald-400'
            );
        }

        box.innerText = msg;
    }


    // ==================================================
    // START LOCATION COLLECTION
    // ==================================================

    function getBestLocation(callback) {

        bestPosition = null;

        locationStartTime = Date.now();


        showStatus(
            "📍 Accurate GPS location li ja rahi hai... thoda wait karein.",
            false
        );


        if (!navigator.geolocation) {

            callback(null);

            return;
        }


        // ------------------------------------------------
        // WATCH GPS
        // ------------------------------------------------

        locationWatchId =
            navigator.geolocation.watchPosition(

                function(position) {

                    console.log(
                        "GPS:",
                        position.coords.latitude,
                        position.coords.longitude,
                        "Accuracy:",
                        position.coords.accuracy
                    );


                    const accuracy =
                        Number(position.coords.accuracy);


                    // First valid position

                    if (!bestPosition) {

                        bestPosition = position;

                    }

                    // Better accuracy received

                    else if (
                        accuracy <
                        Number(
                            bestPosition.coords.accuracy
                        )
                    ) {

                        bestPosition = position;
                    }


                    // Show current accuracy

                    showStatus(
                        "📍 GPS accuracy ±" +
                        accuracy.toFixed(1) +
                        "m — accurate location mil rahi hai...",
                        false
                    );


                    // ------------------------------------------------
                    // GOOD GPS FIX
                    // ------------------------------------------------

                    if (accuracy <= 15) {

                        finishLocation(callback);

                    }

                },

                function(error) {

                    console.error(
                        "GPS error:",
                        error
                    );

                    finishLocation(callback);
                },

                {
                    enableHighAccuracy: true,

                    timeout: 15000,

                    maximumAge: 0
                }
            );


        // ------------------------------------------------
        // MAXIMUM WAIT = 10 SECONDS
        // ------------------------------------------------

        locationTimer = setTimeout(
            function() {

                finishLocation(callback);

            },
            10000
        );

    }


    // ==================================================
    // FINISH GPS COLLECTION
    // ==================================================

    function finishLocation(callback) {

        // Stop watch

        if (
            locationWatchId !== null
        ) {

            navigator.geolocation.clearWatch(
                locationWatchId
            );

            locationWatchId = null;
        }


        // Stop timer

        if (locationTimer) {

            clearTimeout(
                locationTimer
            );

            locationTimer = null;
        }


        console.log(
            "BEST GPS POSITION:",
            bestPosition
        );


        callback(bestPosition);

    }


    // ==================================================
    // QR SCAN SUCCESS
    // ==================================================

    function onScanSuccess(decodedText) {

        // Prevent duplicate scans

        if (scanInProgress) {

            return;
        }

        scanInProgress = true;


        console.log(
            "QR Code detected:",
            decodedText
        );


        // Pause scanner

        if (html5QrcodeScanner) {

            try {

                html5QrcodeScanner.pause(true);

            } catch (e) {

                console.log(e);
            }
        }


        // ------------------------------------------------
        // GET BEST GPS
        // ------------------------------------------------

        getBestLocation(

            function(position) {


                // No location

                if (!position) {

                    showStatus(
                        "GPS location nahi mil saki. Location ON karke dobara try karein.",
                        true
                    );

                    restartScanner();

                    return;
                }


                const lat =
                    position.coords.latitude;

                const lon =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                console.log(
                    "FINAL LAT:",
                    lat
                );

                console.log(
                    "FINAL LON:",
                    lon
                );

                console.log(
                    "FINAL ACCURACY:",
                    accuracy
                );


                showStatus(
                    "📍 GPS ready. Attendance verify ho rahi hai...",
                    false
                );


                // ------------------------------------------------
                // SEND TO FLASK
                // ------------------------------------------------

                fetch(
                    '/api/scan_qr_attendance',
                    {

                        method: 'POST',

                        headers: {

                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({

                            qr_code:
                                decodedText,

                            lat:
                                lat,

                            lon:
                                lon,

                            accuracy:
                                accuracy,

                            email:
                                loggedInUserEmail
                        })
                    }
                )

                .then(
                    function(response) {

                        return response.json();

                    }
                )

                .then(
                    function(data) {

                        console.log(
                            "SERVER:",
                            data
                        );


                        if (
                            data.status ===
                            'success'
                        ) {

                            showStatus(
                                data.message,
                                false
                            );


                            scanInProgress =
                                false;


                        } else {

                            showStatus(
                                data.message ||
                                "Attendance mark nahi hui.",
                                true
                            );


                            restartScanner();

                        }

                    }
                )

                .catch(
                    function(error) {

                        console.error(
                            "Network error:",
                            error
                        );


                        showStatus(
                            "Network Error! Please try again.",
                            true
                        );


                        restartScanner();

                    }
                );

            }
        );

    }


    // ==================================================
    // RESTART SCANNER
    // ==================================================

    function restartScanner() {

        scanInProgress = false;


        setTimeout(
            function() {

                if (html5QrcodeScanner) {

                    try {

                        html5QrcodeScanner.resume();

                    } catch (e) {

                        console.log(
                            "Resume error:",
                            e
                        );
                    }
                }

            },
            3000
        );

    }


    // ==================================================
    // START SCANNER
    // ==================================================

    function startScanner() {

        console.log(
            "Starting QR scanner..."
        );


        if (
            typeof Html5QrcodeScanner ===
            "undefined"
        ) {

            showStatus(
                "QR Scanner library load nahi hui. Internet check karein.",
                true
            );

            return;
        }


        try {

            html5QrcodeScanner =
                new Html5QrcodeScanner(

                    "reader",

                    {

                        fps: 10,

                        qrbox: {

                            width: 250,

                            height: 250

                        },

                        rememberLastUsedCamera:
                            true,

                        showTorchButtonIfSupported:
                            true
                    }
                );


            html5QrcodeScanner.render(
                onScanSuccess
            );


            console.log(
                "Scanner started."
            );


        } catch (error) {

            console.error(
                "Scanner error:",
                error
            );


            showStatus(
                "Scanner start nahi ho paaya. Page refresh karein.",
                true
            );

        }

    }


    // ==================================================
    // PAGE LOAD
    // ==================================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            console.log(
                "Scan page loaded."
            );


            if (!loggedInUserEmail) {

                showStatus(
                    "Aap logged in nahi hain! Kripya pehle login karein.",
                    true
                );


                document
                    .getElementById(
                        'login-btn-container'
                    )
                    .classList
                    .remove('hidden');


                return;
            }


            startScanner();

        }
    );
       
</script>

</body>
</html>
