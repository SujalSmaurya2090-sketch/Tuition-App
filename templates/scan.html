<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance - AMPLE VISION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center">
        <h2 class="text-2xl font-bold mb-1 text-slate-100">Teacher Attendance Scanner</h2>
        <p class="text-xs text-slate-400 mb-6">Classroom QR code ko camera ke saamne laayein</p>

        <!-- Status Message Box -->
        <div id="status-box" class="hidden mb-4 p-3 rounded-lg text-sm font-semibold transition-all"></div>

        <!-- Scanner Reader Box -->
        <div id="reader" class="overflow-hidden rounded-xl border-2 border-dashed border-slate-600 bg-slate-950 min-h-[250px]"></div>
    </div>

    <script>
        // Check email from URL parameter or Flask session
        const urlParams = new URLSearchParams(window.location.search);
        const loggedInUserEmail = urlParams.get('email') || "{{ session.get('user_email', '') }}";

        function showStatus(msg, isError = false) {
            const box = document.getElementById('status-box');
            box.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-400', 'bg-rose-500/20', 'text-rose-400');
            box.classList.add(isError ? 'bg-rose-500/20' : 'bg-emerald-500/20', isError ? 'text-rose-400' : 'text-emerald-400');
            box.innerText = msg;
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            showStatus("Verifying Location & Data...", false);

            if (!loggedInUserEmail) {
                showStatus("Aap logged in nahi hain! Kripya pehle login karein.", true);
                return;
            }

            if (!navigator.geolocation) {
                showStatus("Location permissions not supported!", true);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    fetch('/api/scan_qr_attendance', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            qr_code: decodedText,
                            lat: position.coords.latitude,
                            lon: position.coords.longitude,
                            email: loggedInUserEmail
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            showStatus(data.message, false);
                        } else {
                            showStatus(data.message, true);
                        }
                    })
                    .catch(err => showStatus("Network Error!", true));
                },
                (error) => {
                    showStatus("Please allow Location Access to mark attendance!", true);
                },
                { enableHighAccuracy: true }
            );
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
