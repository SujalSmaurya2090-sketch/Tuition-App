<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance - Ample Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-900 min-h-screen text-white flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700 text-center">
        <h2 class="text-xl font-bold mb-1">Teacher Attendance Scanner</h2>
        <p class="text-xs text-slate-400 mb-4">Classroom QR code ko camera ke saamne laayein</p>

        <!-- Camera Container -->
        <div id="reader" class="overflow-hidden rounded-xl bg-black border-2 border-indigo-500 mb-4"></div>

        <div id="status-box" class="hidden p-3 rounded-xl text-sm font-semibold"></div>
    </div>

    <script>
        function showStatus(msg, isError = false) {
            const box = document.getElementById('status-box');
            box.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-400', 'bg-rose-500/20', 'text-rose-400');
            box.classList.add(isError ? 'bg-rose-500/20' : 'bg-emerald-500/20', isError ? 'text-rose-400' : 'text-emerald-400');
            box.innerText = msg;
        }

        function onScanSuccess(decodedText) {
            // Pause Scanner after first scan
            html5QrcodeScanner.clear();
            showStatus("Verifying Location & Data...", false);

            if (!navigator.geolocation) {
                showStatus("Location permissions not supported!", true);
                return;
            }

            // Get GPS Location & Submit
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    fetch('/api/scan_qr_attendance', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            qr_code: decodedText,
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === 'success') {
                            showStatus(data.message, false);
                        } else {
                            showStatus(data.message, true);
                        }
                    })
                    .catch(err => showStatus("Network Error!", true));
                },
                (error) => {
                    showStatus("Please allow Location Access to mark attendance!", true);
                },
                { enableHighAccuracy: true }
            );
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
