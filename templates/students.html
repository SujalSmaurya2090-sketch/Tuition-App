<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Students • Ample Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input, select, button { min-height: 44px; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 pb-12">

  <!-- Reusable Popup Modal -->
  <div id="appPopupBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div id="appPopupCard" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0 duration-200">
      <div class="p-5">
        <div class="flex items-start gap-3.5">
          <div id="appPopupIcon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold"></div>
          <div class="min-w-0 flex-1">
            <h3 id="appPopupTitle" class="text-base font-semibold text-white"></h3>
            <p id="appPopupMessage" class="mt-1 text-sm text-slate-300 leading-relaxed"></p>
          </div>
        </div>
        <div class="mt-5 flex justify-end">
          <button id="appPopupCloseBtn" type="button" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white transition">
            Theek Hai
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800/80">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="text-[11px] uppercase tracking-wider text-indigo-400 font-semibold">Ample Vision Academy</p>
        <h1 class="text-base sm:text-xl font-bold text-white truncate">Students Directory</h1>
      </div>
      <a href="/" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-900 hover:bg-slate-800 border border-slate-800 text-indigo-300 transition shrink-0">
        ← Home
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-5 space-y-6">

    <!-- Stats Row -->
    <section class="grid grid-cols-3 gap-3 sm:gap-4">
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4">
        <p class="text-xs text-slate-400">Total</p>
        <p id="totalStudents" class="mt-1 text-xl sm:text-2xl font-bold text-indigo-400">0</p>
      </div>
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4">
        <p class="text-xs text-slate-400">Active</p>
        <p id="activeStudents" class="mt-1 text-xl sm:text-2xl font-bold text-emerald-400">0</p>
      </div>
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4">
        <p class="text-xs text-slate-400">Showing</p>
        <p id="foundStudents" class="mt-1 text-xl sm:text-2xl font-bold text-white">0</p>
      </div>
    </section>

    <!-- Add Student Card -->
    <section class="rounded-2xl bg-slate-900 border border-slate-800 p-5 sm:p-6">
      <div class="mb-4">
        <h2 class="text-base sm:text-lg font-bold text-white">Add New Student</h2>
        <p class="text-xs sm:text-sm text-slate-400 mt-0.5">Naye student ki detail ek baar save karein</p>
      </div>

      <form id="studentForm" onsubmit="registerStudent(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div>
          <label for="fullName" class="block text-xs font-medium text-slate-300 mb-1.5">Full Name</label>
          <input id="fullName" type="text" required placeholder="e.g. Ramesh Patel"
                 class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 outline-none" />
        </div>

        <div>
          <label for="className" class="block text-xs font-medium text-slate-300 mb-1.5">Class / Batch</label>
          <input id="className" type="text" required placeholder="e.g. 10th Science"
                 class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 outline-none" />
        </div>

        <div>
          <label for="parentContact" class="block text-xs font-medium text-slate-300 mb-1.5">Parent Contact</label>
          <input id="parentContact" type="tel" required placeholder="9876543210"
                 class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 outline-none" />
        </div>

        <div>
          <label for="monthlyFee" class="block text-xs font-medium text-slate-300 mb-1.5">Monthly Fee (₹)</label>
          <input id="monthlyFee" type="number" required min="0" placeholder="1500"
                 class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 outline-none" />
        </div>

        <div>
          <label for="joiningDate" class="block text-xs font-medium text-slate-300 mb-1.5">Joining Date</label>
          <input id="joiningDate" type="date" required
                 class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 py-2.5 text-sm text-white outline-none" />
        </div>

        <div class="flex items-end">
          <button id="registerBtn" type="submit"
                  class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold px-4 py-2.5 text-sm transition">
            + Register Student
          </button>
        </div>
      </form>
    </section>

    <!-- Student Database Section -->
    <section class="rounded-2xl bg-slate-900 border border-slate-800 p-5 sm:p-6">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
        <div>
          <h2 class="text-base sm:text-lg font-bold text-white">Student Database</h2>
          <p class="text-xs sm:text-sm text-slate-400">Naam, ID, ya class se turant search karein</p>
        </div>
        <div class="w-full sm:w-72">
          <input id="studentSearch" type="text" oninput="filterStudents()" placeholder="Search name, ID or class..."
                 class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 outline-none" />
        </div>
      </div>

      <!-- Mobile Card View (visible < md) -->
      <div id="studentsMobileCards" class="space-y-2.5 md:hidden">
        <p class="text-center text-sm text-slate-400 py-6">Loading students...</p>
      </div>

      <!-- Desktop Table View (visible >= md) -->
      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead>
            <tr class="border-b border-slate-800 text-xs uppercase text-slate-400 bg-slate-950/60">
              <th class="p-3 rounded-tl-xl">ID</th>
              <th class="p-3">Name</th>
              <th class="p-3">Class</th>
              <th class="p-3">Parent Contact</th>
              <th class="p-3">Monthly Fee</th>
              <th class="p-3 rounded-tr-xl">Status</th>
            </tr>
          </thead>
          <tbody id="studentsTable" class="divide-y divide-slate-800/80">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400">Loading students...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    window.showAppPopup = function (message, type = 'info', title = '') {
      const backdrop = document.getElementById('appPopupBackdrop');
      const card = document.getElementById('appPopupCard');
      const iconEl = document.getElementById('appPopupIcon');
      const titleEl = document.getElementById('appPopupTitle');
      const msgEl = document.getElementById('appPopupMessage');
      const closeBtn = document.getElementById('appPopupCloseBtn');
      if (!backdrop || !card) return;

      const styles = {
        success: { defaultTitle: 'Safalta', iconBg: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30', btnBg: 'bg-emerald-600 hover:bg-emerald-500', symbol: '✓' },
        error: { defaultTitle: 'Dhyan Dein', iconBg: 'bg-rose-500/15 text-rose-400 border border-rose-500/30', btnBg: 'bg-rose-600 hover:bg-rose-500', symbol: '!' },
        info: { defaultTitle: 'Soochna', iconBg: 'bg-indigo-500/15 text-indigo-400 border border-indigo-500/30', btnBg: 'bg-indigo-600 hover:bg-indigo-500', symbol: 'i' }
      };
      const cfg = styles[type] || styles.info;
      iconEl.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold ${cfg.iconBg}`;
      iconEl.textContent = cfg.symbol;
      titleEl.textContent = title || cfg.defaultTitle;
      msgEl.textContent = String(message || 'Kripya dubara koshish karein.');
      closeBtn.className = `px-5 py-2.5 rounded-xl text-sm font-medium text-white transition ${cfg.btnBg}`;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      requestAnimationFrame(() => { card.classList.remove('scale-95', 'opacity-0'); card.classList.add('scale-100', 'opacity-100'); });

      const hidePopup = () => {
        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { backdrop.classList.add('hidden'); backdrop.classList.remove('flex'); }, 160);
      };
      closeBtn.onclick = hidePopup;
      backdrop.onclick = (e) => { if (e.target === backdrop) hidePopup(); };
    };

    window.safeApiRequest = async function (url, options = {}) {
      try {
        const res = await fetch(url, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
        let data = {};
        try { data = await res.json(); } catch (_) { data = { status: 'error', message: 'Server se jaankari sahi tarah nahi mil paayi.' }; }
        if (!res.ok || data.status === 'error') {
          const p = data.popup || {};
          window.showAppPopup(p.message || data.message || 'Kuch samasya aa gayi hai.', 'error', p.title || 'Dhyan Dein');
          return { ok: false, data };
        }
        return { ok: true, data };
      } catch (_) {
        window.showAppPopup('Internet ya server connection mein dikkat hai. Kripya dubara try karein.', 'error', 'Connection Samasya');
        return { ok: false, data: null };
      }
    };

    let allStudents = [];
    document.getElementById('joiningDate').valueAsDate = new Date();

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadStudents() {
      const tbody = document.getElementById('studentsTable');
      const mobileCards = document.getElementById('studentsMobileCards');
      const { ok, data } = await window.safeApiRequest('/api/students');
      if (!ok) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-rose-400">Students load nahi ho paaye.</td></tr>';
        mobileCards.innerHTML = '<p class="text-center text-sm text-rose-400 py-6">Students load nahi ho paaye.</p>';
        return;
      }
      allStudents = data.students || [];
      renderStudents(allStudents);
    }

    function renderStudents(students) {
      const tbody = document.getElementById('studentsTable');
      const mobileCards = document.getElementById('studentsMobileCards');

      document.getElementById('totalStudents').textContent = allStudents.length;
      document.getElementById('foundStudents').textContent = students.length;
      const activeCount = allStudents.filter(s => String(s.status).toLowerCase() === 'active').length;
      document.getElementById('activeStudents').textContent = activeCount;

      if (!students.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-400">Koi student nahi mila.</td></tr>';
        mobileCards.innerHTML = '<p class="text-center text-sm text-slate-400 py-6">Koi student nahi mila.</p>';
        return;
      }

      tbody.innerHTML = students.map(st => {
        const isActive = String(st.status).toLowerCase() === 'active';
        return `
          <tr class="hover:bg-slate-950/60">
            <td class="p-3 font-semibold text-indigo-400">${escapeHtml(st.id)}</td>
            <td class="p-3 font-medium text-white">${escapeHtml(st.name)}</td>
            <td class="p-3 text-slate-300">${escapeHtml(st.class)}</td>
            <td class="p-3 text-slate-300">${escapeHtml(st.contact)}</td>
            <td class="p-3 font-semibold text-slate-200">₹${escapeHtml(st.fee)}</td>
            <td class="p-3">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${isActive ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'}">
                ${escapeHtml(st.status)}
              </span>
            </td>
          </tr>
        `;
      }).join('');

      mobileCards.innerHTML = students.map(st => {
        const isActive = String(st.status).toLowerCase() === 'active';
        return `
          <div class="rounded-xl bg-slate-950 border border-slate-800 p-3.5 space-y-1.5">
            <div class="flex items-center justify-between gap-2">
              <span class="text-sm font-bold text-white">${escapeHtml(st.name)}</span>
              <span class="text-xs font-semibold text-indigo-400">${escapeHtml(st.id)}</span>
            </div>
            <div class="flex items-center justify-between text-xs text-slate-400">
              <span>${escapeHtml(st.class)}</span>
              <span class="font-semibold text-slate-200">₹${escapeHtml(st.fee)}/mo</span>
            </div>
            <div class="flex items-center justify-between text-xs pt-1">
              <span class="text-slate-400">${escapeHtml(st.contact)}</span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${isActive ? 'bg-emerald-500/15 text-emerald-300' : 'bg-slate-800 text-slate-400'}">
                ${escapeHtml(st.status)}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterStudents() {
      const q = document.getElementById('studentSearch').value.trim().toLowerCase();
      if (!q) { renderStudents(allStudents); return; }
      const filtered = allStudents.filter(st =>
        String(st.id).toLowerCase().includes(q) ||
        String(st.name).toLowerCase().includes(q) ||
        String(st.class).toLowerCase().includes(q) ||
        String(st.contact).toLowerCase().includes(q)
      );
      renderStudents(filtered);
    }

    async function registerStudent(e) {
      e.preventDefault();
      const button = document.getElementById('registerBtn');
      const payload = {
        full_name: document.getElementById('fullName').value.trim(),
        class_name: document.getElementById('className').value.trim(),
        parent_contact: document.getElementById('parentContact').value.trim(),
        monthly_fee: document.getElementById('monthlyFee').value,
        joining_date: document.getElementById('joiningDate').value
      };

      if (!payload.full_name || !payload.class_name || !payload.parent_contact || !payload.monthly_fee || !payload.joining_date) {
        window.showAppPopup('Kripya saari details achhe se bhar dein.', 'info');
        return;
      }

      button.disabled = true;
      button.textContent = 'Saving...';

      const { ok, data } = await window.safeApiRequest('/add_student', {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      button.disabled = false;
      button.textContent = '+ Register Student';

      if (ok) {
        window.showAppPopup(data.message || 'Student safaltapurvak register ho gaya!', 'success');
        document.getElementById('studentForm').reset();
        document.getElementById('joiningDate').valueAsDate = new Date();
        await loadStudents();
      }
    }

    document.addEventListener('DOMContentLoaded', loadStudents);
  </script>
</body>
</html>
