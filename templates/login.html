<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login • Ample Vision Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">

  <!-- Reusable Professional Popup Modal -->
  <div id="appPopupBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div id="appPopupCard" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0 duration-200">
      <div class="p-5">
        <div class="flex items-start gap-3.5">
          <div id="appPopupIcon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-lg font-bold"></div>
          <div class="min-w-0 flex-1">
            <h3 id="appPopupTitle" class="text-base font-semibold text-white"></h3>
            <p id="appPopupMessage" class="mt-1 text-sm text-slate-300 leading-relaxed"></p>
          </div>
        </div>
        <div class="mt-5 flex justify-end">
          <button id="appPopupCloseBtn" type="button"
            class="px-5 py-2.5 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white transition">
            Theek Hai
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Card -->
  <div class="w-full max-w-md rounded-3xl bg-slate-900/90 border border-slate-800/90 p-6 sm:p-8 shadow-2xl">
    <div class="flex items-center gap-3.5 mb-7">
      <img src="/icon.jpeg" alt="Logo" onerror="this.style.display='none'"
           class="w-12 h-12 rounded-2xl object-cover border border-slate-700 bg-slate-800 shrink-0" />
      <div>
        <p class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">Ample Vision Portal</p>
        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
      </div>
    </div>

    {% if error %}
    <div id="serverErrorBanner" class="mb-5 rounded-2xl bg-rose-950/70 border border-rose-800/80 px-4 py-3 text-sm text-rose-200 flex items-start gap-2.5">
      <span class="mt-0.5 inline-block w-2 h-2 rounded-full bg-rose-400 shrink-0"></span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form id="loginForm" method="POST" action="/login" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-medium text-slate-300 mb-1.5">Registered Email ID</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               placeholder="name@example.com"
               class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 px-4 py-3 text-sm text-white placeholder-slate-500 outline-none transition" />
      </div>

      <div>
        <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Password / Passcode</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="Enter your password"
                 class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 px-4 py-3 pr-16 text-sm text-white placeholder-slate-500 outline-none transition" />
          <button type="button" id="togglePwBtn"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-slate-400 hover:text-slate-200 px-2 py-1">
            Show
          </button>
        </div>
      </div>

      <button id="loginSubmitBtn" type="submit"
              class="w-full mt-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold py-3.5 text-sm shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2">
        <span>Sign In</span>
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-slate-500">
      Mobile &amp; Tablet Ready • Tuition Management System
    </p>
  </div>

  <script>
    // Global Professional Popup Helper (can be copied into a shared partial/script)
    window.showAppPopup = function (message, type = 'info', title = '') {
      const backdrop = document.getElementById('appPopupBackdrop');
      const card = document.getElementById('appPopupCard');
      const iconEl = document.getElementById('appPopupIcon');
      const titleEl = document.getElementById('appPopupTitle');
      const msgEl = document.getElementById('appPopupMessage');
      const closeBtn = document.getElementById('appPopupCloseBtn');

      if (!backdrop || !card) return;

      const styles = {
        success: {
          defaultTitle: 'Safalta',
          iconBg: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30',
          btnBg: 'bg-emerald-600 hover:bg-emerald-500',
          symbol: '✓'
        },
        error: {
          defaultTitle: 'Dhyan Dein',
          iconBg: 'bg-rose-500/15 text-rose-400 border border-rose-500/30',
          btnBg: 'bg-rose-600 hover:bg-rose-500',
          symbol: '!'
        },
        info: {
          defaultTitle: 'Soochna',
          iconBg: 'bg-indigo-500/15 text-indigo-400 border border-indigo-500/30',
          btnBg: 'bg-indigo-600 hover:bg-indigo-500',
          symbol: 'i'
        }
      };

      const cfg = styles[type] || styles.info;
      iconEl.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold ${cfg.iconBg}`;
      iconEl.textContent = cfg.symbol;
      titleEl.textContent = title || cfg.defaultTitle;
      msgEl.textContent = String(message || 'Kripya dubara koshish karein.');
      closeBtn.className = `px-5 py-2.5 rounded-xl text-sm font-medium text-white transition ${cfg.btnBg}`;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      requestAnimationFrame(() => {
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
      });

      const hidePopup = () => {
        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
          backdrop.classList.add('hidden');
          backdrop.classList.remove('flex');
        }, 160);
      };

      closeBtn.onclick = hidePopup;
      backdrop.onclick = (e) => { if (e.target === backdrop) hidePopup(); };
    };

    window.safeApiRequest = async function (url, options = {}) {
      try {
        const res = await fetch(url, {
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
          ...options
        });
        let data = {};
        try {
          data = await res.json();
        } catch (_) {
          data = { status: 'error', message: 'Server se jaankari sahi tarah nahi mil paayi.' };
        }
        if (!res.ok || data.status === 'error') {
          const popupObj = data.popup || {};
          const msg = popupObj.message || data.message || 'Kuch samasya aa gayi hai. Kripya dubara koshish karein.';
          window.showAppPopup(msg, 'error', popupObj.title || 'Dhyan Dein');
          return { ok: false, data };
        }
        return { ok: true, data };
      } catch (_) {
        window.showAppPopup(
          'Internet ya server se sampark nahi ho pa raha hai. Kripya connection check karke dubara try karein.',
          'error',
          'Connection Samasya'
        );
        return { ok: false, data: null };
      }
    };

    document.getElementById('togglePwBtn')?.addEventListener('click', function () {
      const pwInput = document.getElementById('password');
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      this.textContent = isHidden ? 'Hide' : 'Show';
    });

    document.getElementById('loginForm')?.addEventListener('submit', function () {
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>Signing in...</span>';
    });
  </script>
</body>
</html>
