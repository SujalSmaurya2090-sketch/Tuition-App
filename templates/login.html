<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js')
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AMPLE VISION ACADEMY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full border border-gray-100">
        <div class="text-center mb-6 flex flex-col items-center">
            <h1 class="text-2xl font-black text-slate-800 tracking-wide mt-3">AMPLE VISION ACADEMY</h1>
            <p class="text-xs text-slate-500 font-semibold uppercase mt-1">Staff Access Portal</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-rose-100 text-rose-700 text-sm font-bold rounded-xl text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="admin@amplevision.com" 
                       class="w-full border-2 border-slate-200 rounded-xl p-3 font-semibold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full border-2 border-slate-200 rounded-xl p-3 font-semibold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md text-base transition active:scale-95">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
