<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4F46E5">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js')
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AMPLE VISION ACADEMY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full border border-gray-100">
        <div class="text-center mb-6 flex flex-col items-center">
            <!-- Logo display section -->
            <img src="/icon.jpeg" alt="AMPEL VISION Logo" class="w-20 h-20 object-cover rounded-full mb-3 shadow">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">AMPLE VISION ACADEMY</h1>
            <p class="text-xs text-indigo-600 font-bold uppercase tracking-wider mt-1">Portal Authentication</p>
        </div>

        {% if error %}
        <div class="bg-rose-50 border-l-4 border-rose-500 text-rose-700 p-3 rounded-r mb-4 text-xs font-semibold">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Authorized Email Address</label>
                <input type="email" name="email" required placeholder="name@amplevision.com"
                       class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-600 focus:outline-none text-slate-800 font-medium text-sm">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg text-base transition">
                Sign In
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-6">Contact Admin for login credentials.</p>
    </div>
</body>
</html>
