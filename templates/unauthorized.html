<!DOCTYPE html>
<html lang="en">
<head>

  <title>Access Notice • Ample Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <div class="w-full max-w-sm rounded-3xl bg-slate-900 border border-slate-800 p-7 text-center shadow-2xl">
    <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-2xl font-bold text-amber-400">
      !
    </div>
    <h1 class="text-xl font-bold text-white mb-2">Access Restricted</h1>
    <p class="text-sm text-slate-300 leading-relaxed mb-6">
      {{ message or "Is section ya suvidha ko kholne ki anumati aapke account ke liye nahi hai." }}
    </p>
    <a href="/" class="inline-flex items-center justify-center w-full h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition">

  </div>
