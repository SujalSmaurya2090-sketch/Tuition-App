<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Collection - AMPLE VISION ACADEMY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-md p-6 border border-slate-200">
        
        <div class="flex justify-between items-center mb-6 border-b pb-3">
            <h2 class="text-xl font-extrabold text-slate-800">💰 Fee Collection Entry</h2>
            <a href="/" class="text-indigo-600 font-bold text-sm hover:underline">← Dashboard</a>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-sm font-bold"></div>

        <form id="feeForm" onsubmit="submitFee(event)" class="space-y-4">
            
            <!-- Collected By Info Field (Auto-filled from session) -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Collected By (Logged-in Staff)</label>
                <input type="text" value="{{ user.user_email }}" readonly 
                       class="w-full bg-slate-100 border border-slate-300 rounded-xl p-3 font-semibold text-slate-600 text-sm cursor-not-allowed">
            </div>

            <!-- Select Class -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Class / Batch</label>
                <select id="classSelect" onchange="loadStudents()" required class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
                    <option value="">-- Choose Class --</option>
                </select>
            </div>

            <!-- Select Student -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Student</label>
                <select id="studentSelect" required class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
                    <option value="">-- Select Student --</option>
                </select>
            </div>

            <!-- Amount & For Month -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Amount Paid (₹)</label>
                    <input type="number" id="amount" required placeholder="1500" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">For Month</label>
                    <input type="text" id="forMonth" required placeholder="April 2026" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
                </div>
            </div>

            <!-- Payment Mode & Date -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Payment Mode</label>
                    <select id="paymentMode" required class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Payment Date</label>
                    <input type="date" id="paymentDate" required class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
                </div>
            </div>

            <!-- Receipt No (Optional) -->
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Receipt Number (Optional)</label>
                <input type="text" id="receiptNo" placeholder="REC-101" class="w-full border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-800 text-sm focus:border-indigo-600 focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl shadow-md text-base transition active:scale-95">
                Submit Fee Record
            </button>
        </form>
    </div>

    <script>
        let studentsData = [];

        window.onload = async function() {
            document.getElementById('paymentDate').valueAsDate = new Date();
            const res = await fetch('/get_classes');
            const data = await res.json();
            const classSelect = document.getElementById('classSelect');
            if(data.classes) {
                data.classes.forEach(c => classSelect.innerHTML += `<option value="${c}">${c}</option>`);
            }
        };

        async function loadStudents() {
            const className = document.getElementById('classSelect').value;
            const studentSelect = document.getElementById('studentSelect');
            studentSelect.innerHTML = '<option value="">-- Select Student --</option>';

            if(!className) return;

            const res = await fetch(`/get_students/${className}`);
            const data = await res.json();
            studentsData = data.students || [];

            studentsData.forEach(s => {
                studentSelect.innerHTML += `<option value="${s.Student_ID}">${s.Full_Name} (ID: ${s.Student_ID})</option>`;
            });
        }

        async function submitFee(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const studentId = document.getElementById('studentSelect').value;
            const selectedStudent = studentsData.find(s => s.Student_ID === studentId);

            const payload = {
                student_id: studentId,
                student_name: selectedStudent ? selectedStudent.Full_Name : '',
                class_name: document.getElementById('classSelect').value,
                amount: document.getElementById('amount').value,
                for_month: document.getElementById('forMonth').value,
                payment_mode: document.getElementById('paymentMode').value,
                payment_date: document.getElementById('paymentDate').value,
                receipt_no: document.getElementById('receiptNo').value
            };

            const res = await fetch('/save_fee', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            alertBox.classList.remove('hidden');

            if(res.ok && result.status === 'success') {
                alertBox.className = "mb-4 p-3 rounded-xl text-sm font-bold bg-green-100 text-green-700";
                alertBox.innerText = result.message;
                document.getElementById('feeForm').reset();
                document.getElementById('paymentDate').valueAsDate = new Date();
            } else {
                alertBox.className = "mb-4 p-3 rounded-xl text-sm font-bold bg-rose-100 text-rose-700";
                alertBox.innerText = result.message;
            }
        }
    </script>
</body>
</html>
