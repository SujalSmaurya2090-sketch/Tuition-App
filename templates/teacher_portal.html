<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#4f46e5">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
  }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal - AMPLE VISION ACADEMY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6 flex items-center justify-center">
    <div class="max-w-2xl w-full space-y-6">
        
        <!-- Header Section -->
        <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center space-x-3">
                <img src="/static/images/logo.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3429/3429149.png';" class="w-12 h-12 object-contain">
                <div>
                    <h1 class="text-xl font-extrabold text-slate-800">AMPLE VISION ACADEMY</h1>
                    <p class="text-xs text-indigo-600 font-semibold">Teacher Portal | Welcome, {{ user.user_name }}</p>
                </div>
            </div>
            <a href="/logout" class="text-xs font-bold text-rose-600 bg-rose-50 px-3.5 py-2 rounded-xl hover:bg-rose-100 transition">Logout</a>
        </div>

        <!-- 4-Feature Action Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <a href="/attendance" class="bg-indigo-600 hover:bg-indigo-700 text-white p-6 rounded-2xl shadow-md font-bold text-lg text-center block transition transform active:scale-95">
                📋 Attendance
            </a>
            <a href="/marks" class="bg-blue-600 hover:bg-blue-700 text-white p-6 rounded-2xl shadow-md font-bold text-lg text-center block transition transform active:scale-95">
                📝 Marks Entry
            </a>
            <a href="/students" class="bg-emerald-600 hover:bg-emerald-700 text-white p-6 rounded-2xl shadow-md font-bold text-lg text-center block transition transform active:scale-95">
                👤 Add Student
            </a>
            <a href="/fees" class="bg-amber-600 hover:bg-amber-700 text-white p-6 rounded-2xl shadow-md font-bold text-lg text-center block transition transform active:scale-95">
                💰 Collect Fee
            </a>
        </div>

    </div>
</body>
</html>
