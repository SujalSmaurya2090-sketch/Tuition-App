<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Teacher Portal • Ample Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 pb-12">

  <!-- Reusable Popup Modal -->
  <div id="appPopupBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div id="appPopupCard" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0 duration-200">
      <div class="p-5">
        <div class="flex items-start gap-3.5">
          <div id="appPopupIcon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold"></div>
          <div class="min-w-0 flex-1">
            <h3 id="appPopupTitle" class="text-base font-semibold text-white"></h3>
            <p id="appPopupMessage" class="mt-1 text-sm text-slate-300 leading-relaxed"></p>
          </div>
        </div>
        <div class="mt-5 flex justify-end">
          <button id="appPopupCloseBtn" type="button" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white transition">
            Theek Hai
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800/80">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <img src="/icon.jpeg" alt="Logo" onerror="this.style.display='none'"
             class="w-10 h-10 rounded-xl object-cover border border-slate-800 bg-slate-900 shrink-0" />
        <div class="min-w-0">
          <p class="text-[11px] uppercase tracking-wider text-indigo-400 font-semibold">Teacher Workspace</p>
          <h1 class="text-base sm:text-lg font-bold text-white truncate">{{ user.user_name }}</h1>
        </div>
      </div>
      <a href="/logout"
         class="px-3.5 py-2 rounded-xl text-xs font-medium bg-rose-950/70 hover:bg-rose-900/70 border border-rose-800/70 text-rose-200 transition shrink-0">
        Logout
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-5 space-y-6">

    <!-- Quick Action Grid -->
    <section class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">
      <a href="/attendance" class="rounded-2xl bg-slate-900 hover:bg-slate-800/90 active:scale-[0.99] border border-slate-800 p-4 transition">
        <p class="text-sm font-semibold text-white">Daily Attendance</p>
        <p class="text-xs text-slate-400 mt-1">Mark class presence</p>
      </a>

      <a href="/marks" class="rounded-2xl bg-slate-900 hover:bg-slate-800/90 active:scale-[0.99] border border-slate-800 p-4 transition">
        <p class="text-sm font-semibold text-white">Marks Entry</p>
        <p class="text-xs text-slate-400 mt-1">Upload test scores</p>
      </a>

      <a href="/students" class="rounded-2xl bg-slate-900 hover:bg-slate-800/90 active:scale-[0.99] border border-slate-800 p-4 transition">
        <p class="text-sm font-semibold text-white">Students</p>
        <p class="text-xs text-slate-400 mt-1">Add or view students</p>
      </a>

      <a href="/fees" class="rounded-2xl bg-slate-900 hover:bg-slate-800/90 active:scale-[0.99] border border-slate-800 p-4 transition">
        <p class="text-sm font-semibold text-white">Fee Entry</p>
        <p class="text-xs text-slate-400 mt-1">Record fee payment</p>
      </a>

      <a href="/scan" class="col-span-2 sm:col-span-2 rounded-2xl bg-indigo-600/15 hover:bg-indigo-600/25 active:scale-[0.99] border border-indigo-500/40 p-4 transition">
        <p class="text-sm font-semibold text-indigo-300">QR &amp; Location Attendance</p>
        <p class="text-xs text-indigo-200/75 mt-1">Mark your daily branch attendance</p>
      </a>
    </section>

    <!-- Assigned Classes Section -->
    <section class="rounded-2xl bg-slate-900 border border-slate-800 p-5">
      <div class="flex items-center justify-between mb-3.5">
        <h2 class="text-base font-semibold text-white">Meri Assigned Classes</h2>
        <button id="reloadClassesBtn" type="button" class="text-xs text-indigo-400 hover:text-indigo-300">Refresh</button>
      </div>
      <div id="myClassesList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <p class="text-sm text-slate-400">Loading classes...</p>
      </div>
    </section>

  </main>

  <script>
    window.showAppPopup = function (message, type = 'info', title = '') {
      const backdrop = document.getElementById('appPopupBackdrop');
      const card = document.getElementById('appPopupCard');
      const iconEl = document.getElementById('appPopupIcon');
      const titleEl = document.getElementById('appPopupTitle');
      const msgEl = document.getElementById('appPopupMessage');
      const closeBtn = document.getElementById('appPopupCloseBtn');
      if (!backdrop || !card) return;

      const styles = {
        success: { defaultTitle: 'Safalta', iconBg: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30', btnBg: 'bg-emerald-600 hover:bg-emerald-500', symbol: '✓' },
        error: { defaultTitle: 'Dhyan Dein', iconBg: 'bg-rose-500/15 text-rose-400 border border-rose-500/30', btnBg: 'bg-rose-600 hover:bg-rose-500', symbol: '!' },
        info: { defaultTitle: 'Soochna', iconBg: 'bg-indigo-500/15 text-indigo-400 border border-indigo-500/30', btnBg: 'bg-indigo-600 hover:bg-indigo-500', symbol: 'i' }
      };
      const cfg = styles[type] || styles.info;
      iconEl.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold ${cfg.iconBg}`;
      iconEl.textContent = cfg.symbol;
      titleEl.textContent = title || cfg.defaultTitle;
      msgEl.textContent = String(message || 'Kripya dubara koshish karein.');
      closeBtn.className = `px-5 py-2.5 rounded-xl text-sm font-medium text-white transition ${cfg.btnBg}`;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      requestAnimationFrame(() => { card.classList.remove('scale-95', 'opacity-0'); card.classList.add('scale-100', 'opacity-100'); });

      const hidePopup = () => {
        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { backdrop.classList.add('hidden'); backdrop.classList.remove('flex'); }, 160);
      };
      closeBtn.onclick = hidePopup;
      backdrop.onclick = (e) => { if (e.target === backdrop) hidePopup(); };
    };

    async function loadMyClasses() {
      const box = document.getElementById('myClassesList');
      try {
        const res = await fetch('/api/teacher/my_classes');
        const data = await res.json();
        if (!res.ok || data.status === 'error') {
          const p = data.popup || {};
          window.showAppPopup(p.message || data.message || 'Classes load nahi ho paayi.', 'error', p.title || 'Dhyan Dein');
          box.innerHTML = '<p class="text-sm text-slate-400">Abhi classes dikh nahi rahi hain.</p>';
          return;
        }
        const classes = data.classes || [];
        if (!classes.length) {
          box.innerHTML = '<p class="text-sm text-slate-400">Aapko abhi koi active class assign nahi ki gayi hai.</p>';
          return;
        }
        box.innerHTML = classes.map((c) => `
          <div class="rounded-xl bg-slate-950 border border-slate-800 p-3.5">
            <div class="flex items-center justify-between gap-2">
              <span class="text-sm font-semibold text-white">${c.class || 'Class'}</span>
              <span class="text-xs px-2 py-0.5 rounded-md bg-indigo-500/15 text-indigo-300 border border-indigo-500/30">${c.subject || 'Subject'}</span>
            </div>
            <p class="text-xs text-slate-400 mt-1.5">${[c.branch, c.medium].filter(Boolean).join(' • ') || 'Assigned Batch'}</p>
          </div>
        `).join('');
      } catch (_) {
        window.showAppPopup('Internet ya server connection mein dikkat hai.', 'error', 'Connection Samasya');
      }
    }

    document.getElementById('reloadClassesBtn')?.addEventListener('click', loadMyClasses);
    loadMyClasses();
  </script>
</body>
</html>
