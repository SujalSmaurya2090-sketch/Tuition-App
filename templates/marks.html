<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Marks Entry • Ample Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 pb-24">

  <!-- Reusable Popup Modal -->
  <div id="appPopupBackdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div id="appPopupCard" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0 duration-200">
      <div class="p-5">
        <div class="flex items-start gap-3.5">
          <div id="appPopupIcon" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold"></div>
          <div class="min-w-0 flex-1">
            <h3 id="appPopupTitle" class="text-base font-semibold text-white"></h3>
            <p id="appPopupMessage" class="mt-1 text-sm text-slate-300 leading-relaxed"></p>
          </div>
        </div>
        <div class="mt-5 flex justify-end">
          <button id="appPopupCloseBtn" type="button" class="px-5 py-2.5 rounded-xl text-sm font-medium text-white transition">
            Theek Hai
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800/80">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between gap-3">
      <div>
        <p class="text-[11px] uppercase tracking-wider text-indigo-400 font-semibold">Ample Vision</p>
        <h1 class="text-base sm:text-xl font-bold text-white">Rapid Marks Entry</h1>
      </div>
      <a href="/" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-slate-900 hover:bg-slate-800 border border-slate-800 text-indigo-300 transition">
        ← Home
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-5 space-y-5">

    <!-- Test Meta Form -->
    <section class="rounded-2xl bg-slate-900 border border-slate-800 p-4 sm:p-6">
      <h2 class="text-sm sm:text-base font-semibold text-white mb-4">Test Details</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div>
          <label for="classSelect" class="block text-xs font-medium text-slate-300 mb-1.5">Class / Batch</label>
          <select id="classSelect" onchange="loadStudents()"
                  class="w-full h-11 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 text-sm font-semibold text-white outline-none">
            <option value="">-- Loading Classes... --</option>
          </select>
        </div>

        <div>
          <label for="subjectInput" class="block text-xs font-medium text-slate-300 mb-1.5">Subject</label>
          <input id="subjectInput" type="text" placeholder="e.g. Maths / Science"
                 class="w-full h-11 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 text-sm text-white placeholder-slate-500 outline-none" />
        </div>

        <div>
          <label for="testTitleInput" class="block text-xs font-medium text-slate-300 mb-1.5">Test Title</label>
          <input id="testTitleInput" type="text" placeholder="e.g. Unit Test 1"
                 class="w-full h-11 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 text-sm text-white placeholder-slate-500 outline-none" />
        </div>

        <div>
          <label for="testDateInput" class="block text-xs font-medium text-slate-300 mb-1.5">Test Date</label>
          <input id="testDateInput" type="date"
                 class="w-full h-11 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 text-sm text-white outline-none" />
        </div>

        <div>
          <label for="totalMarksInput" class="block text-xs font-medium text-slate-300 mb-1.5">Total Max Marks</label>
          <input id="totalMarksInput" type="number" min="1" value="50" placeholder="50"
                 class="w-full h-11 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3.5 text-sm text-white placeholder-slate-500 outline-none" />
        </div>
      </div>
    </section>

    <div id="loader" class="hidden rounded-2xl bg-slate-900 border border-slate-800 p-5 text-center text-sm text-indigo-400">
      Loading students...
    </div>

    <!-- Marks Entry Cards/List -->
    <section id="registerContainer" class="hidden space-y-4">
      <div id="studentListContainer" class="space-y-2.5"></div>

      <button id="submitMarksBtn" type="button" onclick="submitMarks()"
              class="w-full h-12 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold text-sm shadow-lg shadow-indigo-600/20 transition">
        Save Test Marks
      </button>
    </section>

  </main>

  <script>
    window.showAppPopup = function (message, type = 'info', title = '') {
      const backdrop = document.getElementById('appPopupBackdrop');
      const card = document.getElementById('appPopupCard');
      const iconEl = document.getElementById('appPopupIcon');
      const titleEl = document.getElementById('appPopupTitle');
      const msgEl = document.getElementById('appPopupMessage');
      const closeBtn = document.getElementById('appPopupCloseBtn');
      if (!backdrop || !card) return;

      const styles = {
        success: { defaultTitle: 'Safalta', iconBg: 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30', btnBg: 'bg-emerald-600 hover:bg-emerald-500', symbol: '✓' },
        error: { defaultTitle: 'Dhyan Dein', iconBg: 'bg-rose-500/15 text-rose-400 border border-rose-500/30', btnBg: 'bg-rose-600 hover:bg-rose-500', symbol: '!' },
        info: { defaultTitle: 'Soochna', iconBg: 'bg-indigo-500/15 text-indigo-400 border border-indigo-500/30', btnBg: 'bg-indigo-600 hover:bg-indigo-500', symbol: 'i' }
      };
      const cfg = styles[type] || styles.info;
      iconEl.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-base font-bold ${cfg.iconBg}`;
      iconEl.textContent = cfg.symbol;
      titleEl.textContent = title || cfg.defaultTitle;
      msgEl.textContent = String(message || 'Kripya dubara koshish karein.');
      closeBtn.className = `px-5 py-2.5 rounded-xl text-sm font-medium text-white transition ${cfg.btnBg}`;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      requestAnimationFrame(() => { card.classList.remove('scale-95', 'opacity-0'); card.classList.add('scale-100', 'opacity-100'); });

      const hidePopup = () => {
        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { backdrop.classList.add('hidden'); backdrop.classList.remove('flex'); }, 160);
      };
      closeBtn.onclick = hidePopup;
      backdrop.onclick = (e) => { if (e.target === backdrop) hidePopup(); };
    };

    window.safeApiRequest = async function (url, options = {}) {
      try {
        const res = await fetch(url, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
        let data = {};
        try { data = await res.json(); } catch (_) { data = { status: 'error', message: 'Server se jaankari sahi tarah nahi mil paayi.' }; }
        if (!res.ok || data.status === 'error') {
          const p = data.popup || {};
          window.showAppPopup(p.message || data.message || 'Kuch samasya aa gayi hai.', 'error', p.title || 'Dhyan Dein');
          return { ok: false, data };
        }
        return { ok: true, data };
      } catch (_) {
        window.showAppPopup('Internet ya server connection mein dikkat hai. Kripya dubara try karein.', 'error', 'Connection Samasya');
        return { ok: false, data: null };
      }
    };

    let studentData = [];
    document.getElementById('testDateInput').valueAsDate = new Date();

    window.onload = async function () {
      const classSelect = document.getElementById('classSelect');
      const { ok, data } = await window.safeApiRequest('/get_classes');
      if (!ok) {
        classSelect.innerHTML = '<option value="">-- Choose Class --</option>';
        return;
      }
      classSelect.innerHTML = '<option value="">-- Choose Class --</option>';
      (data.classes || []).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        classSelect.appendChild(opt);
      });
    };

    async function loadStudents() {
      const className = document.getElementById('classSelect').value;
      const container = document.getElementById('registerContainer');
      const listEl = document.getElementById('studentListContainer');

      if (!className) {
        container.classList.add('hidden');
        return;
      }

      document.getElementById('loader').classList.remove('hidden');
      container.classList.add('hidden');

      const { ok, data } = await window.safeApiRequest(`/get_students/${encodeURIComponent(className)}`);
      document.getElementById('loader').classList.add('hidden');

      if (!ok) return;

      studentData = data.students || [];
      if (!studentData.length) {
        listEl.innerHTML = '<div class="rounded-2xl bg-slate-900 border border-slate-800 p-6 text-center text-sm text-slate-400">Is class mein koi active student nahi mila.</div>';
        container.classList.remove('hidden');
        return;
      }

      listEl.innerHTML = studentData.map(student => `
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <p class="text-sm font-semibold text-white truncate">${student.Full_Name || ''}</p>
              <p class="text-xs text-slate-400">ID: ${student.Student_ID || ''}</p>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Obtained Marks</label>
              <input type="number" step="0.5" min="0" id="marks-${student.Student_ID}" placeholder="0"
                     class="w-full h-10 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3 text-sm font-bold text-indigo-300 outline-none" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Remarks (Optional)</label>
              <input type="text" id="remarks-${student.Student_ID}" placeholder="Good / Needs practice"
                     class="w-full h-10 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 px-3 text-sm text-white placeholder-slate-500 outline-none" />
            </div>
          </div>
        </div>
      `).join('');

      container.classList.remove('hidden');
    }

    async function submitMarks() {
      const className = document.getElementById('classSelect').value;
      const subject = document.getElementById('subjectInput').value.trim();
      const testTitle = document.getElementById('testTitleInput').value.trim();
      const testDate = document.getElementById('testDateInput').value;
      const totalMarks = parseFloat(document.getElementById('totalMarksInput').value);

      if (!className || !subject || !testTitle || !testDate || Number.isNaN(totalMarks) || totalMarks <= 0) {
        window.showAppPopup('Kripya class, subject, test title, date aur total marks sahi se bharein.', 'info');
        return;
      }

      const marksPayload = [];
      for (const s of studentData) {
        const marksVal = document.getElementById(`marks-${s.Student_ID}`).value;
        const remarksVal = document.getElementById(`remarks-${s.Student_ID}`).value.trim();
        const obtainedNum = parseFloat(marksVal) || 0;

        if (obtainedNum > totalMarks) {
          window.showAppPopup(
            `${s.Full_Name} ke obtained marks total marks se zyada nahi ho sakte.`,
            'error',
            'Marks Check'
          );
          return;
        }

        marksPayload.push({
          student_id: s.Student_ID,
          student_name: s.Full_Name,
          obtained_marks: obtainedNum,
          remarks: remarksVal
        });
      }

      const btn = document.getElementById('submitMarksBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const { ok, data } = await window.safeApiRequest('/save_marks', {
        method: 'POST',
        body: JSON.stringify({
          class_name: className,
          subject,
          test_title: testTitle,
          test_date: testDate,
          total_marks: totalMarks,
          marks_data: marksPayload
        })
      });

      btn.disabled = false;
      btn.textContent = 'Save Test Marks';

      if (ok) {
        window.showAppPopup(data.message || 'Marks safaltapurvak save ho gaye!', 'success');
        document.getElementById('testTitleInput').value = '';
        document.getElementById('registerContainer').classList.add('hidden');
        document.getElementById('classSelect').value = '';
      }
    }
  </script>
</body>
</html>
