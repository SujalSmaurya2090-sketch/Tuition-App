<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rapid Attendance Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-3 sm:p-6">

<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg border border-gray-100 p-4 sm:p-6">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
            📋 Rapid Attendance Entry
        </h2>
        <a href="/" class="text-sm text-indigo-600 hover:underline">← Home</a>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-3 text-sm rounded-xl font-medium"></div>

    <div class="space-y-4 mb-6">
        <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Select Batch / Class:</label>
            <select id="classSelect" onchange="loadStudents()" class="w-full h-12 px-3 border-2 border-indigo-500 rounded-xl font-bold text-indigo-900 bg-white focus:outline-none">
                <option value="">-- Select Class --</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Date:</label>
            <input type="date" id="attDate" class="w-full h-10 px-3 border border-gray-300 rounded-xl bg-gray-50 font-medium text-gray-700">
        </div>
    </div>

    <!-- Student Cards Container -->
    <div id="studentListContainer" class="space-y-3 mb-6">
        <p class="text-center text-gray-400 py-4">Please select a class to load students</p>
    </div>

    <button id="submitBtn" onclick="submitAttendance()" class="w-full h-12 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 transition-all">
        Submit Attendance
    </button>
</div>

<script>
    document.getElementById('attDate').value = new Date().toISOString().split('T')[0];

    window.onload = function() {
        fetch('/get_classes')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('classSelect');
                select.innerHTML = '<option value="">-- Select Class --</option>';
                data.classes.forEach(cls => {
                    select.innerHTML += `<option value="${cls}">${cls}</option>`;
                });
            })
            .catch(err => showAlert("Failed to fetch classes from database", "red"));
    };

    function showAlert(msg, color) {
        const box = document.getElementById('alertBox');
        box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-yellow-100', 'text-yellow-700');
        if (color === 'red') box.classList.add('bg-red-100', 'text-red-700');
        else if (color === 'green') box.classList.add('bg-green-100', 'text-green-700');
        else box.classList.add('bg-yellow-100', 'text-yellow-700');
        box.innerText = msg;
    }

    function loadStudents() {
        const selectedClass = document.getElementById('classSelect').value;
        const container = document.getElementById('studentListContainer');

        if (!selectedClass) {
            container.innerHTML = `<p class="text-center text-gray-400 py-4">Please select a class to load students</p>`;
            return;
        }

        container.innerHTML = `<p class="text-center text-indigo-600 font-medium py-4">Loading students...</p>`;

        fetch(`/get_students/${encodeURIComponent(selectedClass)}`)
            .then(res => res.json())
            .then(data => {
                container.innerHTML = "";
                if (!data.students || data.students.length === 0) {
                    container.innerHTML = `<p class="text-center text-red-500 py-4">No active students found in this class.</p>`;
                    return;
                }

                data.students.forEach(st => {
    container.innerHTML += `
        <div class="student-card flex items-center justify-between p-3.5 bg-gray-50 rounded-xl border border-gray-200"
             data-id="${st.Student_ID}" 
             data-name="${st.Full_Name}">
            <div>
                <div class="font-bold text-gray-800">${st.Full_Name}</div>
                <div class="text-xs text-gray-400 font-mono">ID: ${st.Student_ID}</div>
            </div>
            <button type="button" 
                    onclick="toggleStatus(this)" 
                    class="status-btn px-5 py-2 rounded-lg text-sm font-bold transition-all bg-emerald-500 text-white">
                Present
            </button>
        </div>
    `;
});
            })
            .catch(err => {
                container.innerHTML = `<p class="text-center text-red-500 py-4">Error loading student list.</p>`;
            });
    }

    function toggleStatus(btn) {
        if (btn.innerText.trim() === 'Present') {
            btn.innerText = 'Absent';
            btn.className = 'status-btn px-5 py-2 rounded-lg text-sm font-bold transition-all bg-rose-500 text-white';
        } else {
            btn.innerText = 'Present';
            btn.className = 'status-btn px-5 py-2 rounded-lg text-sm font-bold transition-all bg-emerald-500 text-white';
        }
    }

    function submitAttendance() {
        const className = document.getElementById('classSelect').value;
        const attDate = document.getElementById('attDate').value;
        const submitBtn = document.getElementById('submitBtn');

        if (!className) {
            showAlert("Please select a class first!", "yellow");
            return;
        }

        const cards = document.querySelectorAll('.student-card');
        const attendanceData = [];

        cards.forEach(card => {
            const sId = card.getAttribute('data-id');
            const sName = card.getAttribute('data-name');
            const btn = card.querySelector('.status-btn');
            const status = btn ? btn.innerText.trim() : 'Present';

            if (sId && sName) {
                attendanceData.push({
                    student_id: sId,
                    student_name: sName,
                    status: status
                });
            }
        });

        if (attendanceData.length === 0) {
            showAlert("No student records found to submit!", "red");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "Saving to Google Sheet...";

        const payload = {
            class_name: className,
            date: attDate,
            attendance_data: attendanceData
        };

        fetch('/save_attendance', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(result => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Attendance";

            if (result.status === "success") {
                showAlert("✅ " + result.message, "green");
                setTimeout(() => {
                    document.getElementById('studentListContainer').innerHTML = `<p class="text-center text-gray-400 py-4">Select a class to mark attendance again.</p>`;
                }, 1500);
            } else {
                showAlert("❌ Error: " + result.message, "red");
            }
        })
        .catch(err => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Attendance";
            showAlert("❌ Connection error while saving!", "red");
        });
    }
</script>

</body>
</html>
